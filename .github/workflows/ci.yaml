# Third-party actions are pinned to commit SHAs. To resolve a tag:
#   git ls-remote https://github.com/<owner>/<repo>.git refs/tags/<version>
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint, typecheck, and test are not included yet: they currently fail in packages/tab-id-hook
      # (no ESLint config or tsconfig). Add them once fixed.
      - name: Check formatting
        run: pnpm --recursive --if-present run format:check

      - name: Build
        run: pnpm --recursive --if-present run build

      - name: Check package exports
        run: pnpm --recursive --if-present run exports:check
