# Opens and maintains a "Version Packages" pull request from changesets on main. Merging it
# publishes the new package versions to npmjs.org under the @dts-stn scope.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in this repository. Each
# package's trusted publisher on npmjs.com must name this repository and this workflow file
# (release.yaml). See "Release Workflow" in README.md.
#
# Third-party actions are pinned to commit SHAs. To resolve a tag:
#   git ls-remote https://github.com/<owner>/<repo>.git refs/tags/<version>
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check npm version
        # Trusted publishing requires npm 11.5.1 or later.
        run: |
          set -euo pipefail
          npm --version
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1)" "$(npm --version)" \
            || { echo "::error::npm 11.5.1 or later is required for trusted publishing"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty so setup-node's placeholder token never shadows OIDC.
          NODE_AUTH_TOKEN: ""
